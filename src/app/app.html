<mat-drawer-container [hasBackdrop]="true">
    <mat-drawer id="menu" #drawer mode="over">
        <button id="close-menu" type="button" (click)="drawer.close()">
            <mat-icon class="icon">close</mat-icon>
        </button>
    </mat-drawer>

    <mat-drawer-content>
        <app-header (openMenu)="drawer.open()"></app-header>

        <router-outlet></router-outlet>

        <app-footer></app-footer>
    </mat-drawer-content>
</mat-drawer-container>
