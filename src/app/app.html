<mat-drawer-container [hasBackdrop]="true">
    <mat-drawer id="menu" #drawer mode="over" (mouseleave)="drawer.close()">
        <button id="home" type="button" (click)="drawer.close()" routerLink="/home">
            <mat-icon class="icon">home</mat-icon>
        </button>
    </mat-drawer>

    <mat-drawer-content>
        <app-header (openMenu)="drawer.open()"></app-header>

        <router-outlet></router-outlet>

        <app-footer></app-footer>
    </mat-drawer-content>
</mat-drawer-container>
