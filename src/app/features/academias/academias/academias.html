<mat-card class="card-academia" appearance="outlined">
   
        <img mat-card-image [src]="imagem" alt="imagem da unidade">
        <mat-card-title> {{ nome }}</mat-card-title>
    
        <p> {{ endereco }} </p>
        <p> {{ contato }} </p>


    <mat-card-actions>
        <button mat-raised-button color="primary" (click)="selecionarAcademia()">Selecionar Academia</button>
    </mat-card-actions>
</mat-card>
