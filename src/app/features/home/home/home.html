<main>
    <video src="videos/logoVideo.mp4" autoplay loop id="logo-video"></video>
    <section>
        <h2>O primeiro passo é o mais importante</h2>
        <section id="categorias-lista">
            @for (pagina of paginas; track $index) {
            <mat-card class="categoria-card" appearance="outlined">
                <img mat-card-image [src]="pagina.imagen" [alt]="pagina.alt">
                <h3> {{ pagina.nome }} </h3>
                <p>{{ pagina.descricao }}</p>
                <button matButton [routerLink]="pagina.path"><mat-icon>arrow_forward</mat-icon></button>
            </mat-card>
            }
    </section>
    </section>
</main>
